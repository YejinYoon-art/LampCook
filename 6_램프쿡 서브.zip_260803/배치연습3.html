<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배치연습3</title>
  <link rel="stylesheet" href="배치연습3.css">
</head>

<body>


  <div class="item">
    <a href="#">
      <!-- img -->
      <div class="imgBox">
        <img src="phone.png" alt="item1">
      </div>
      <!-- //img -->
      <!-- inner -->
      <div class="inner">
        <!-- delivery -->
          <div class="delivery">무료배송</div>
        <!-- //delivery -->
        <!-- title -->
          <div class="title">
            삼성전자 갤럭시 S 25 512GB 미개봉 새상품, 아이스블루
          </div>
        <!-- //title -->
        <!-- price -->
          <div class="price">
            <div class="discount">
              <span class="discount_label">쿠폰할인</span>
              <span class="discount_rate">75%</span>
              <span class="original_price">1,298,000원</span>
            </div>
            <div class="finalPrice">316,000원</div>
          </div>
        <!-- //price -->
        <!-- date -->
         <div class="date">8/13 도착 예정</div>
        <!-- //date -->
        <!-- rating -->
         <div class="rating">⭐⭐⭐⭐⭐ <span>(4)</span></div>
        <!-- //rating -->
        <!-- benefit -->
          <div class="benefit">
            <div class="benefit_box">
              최대 15,800원 적립
            </div>
          </div>
        <!-- benefit -->
      </div>
      <!-- //inner -->
    </a>
  </div>


</body>

</html>
